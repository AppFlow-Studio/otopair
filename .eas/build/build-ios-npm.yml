build:
  name: iOS build (forced npm install)
  steps:
    - eas/checkout

    # EAS's default `eas/install_node_modules` auto-detects the package manager,
    # and the SDK 55 build image wrongly resolves this npm project to yarn.
    # Run npm explicitly so the install always uses package-lock.json.
    - run:
        name: Install dependencies (npm ci)
        # Pin npm to the version that generated package-lock.json (local was 11.6.0)
        # so EAS resolves the same tree -> npm ci stays in sync. Fall back to
        # `npm install` if any residual mismatch remains, so the step can't hard-fail.
        command: |
          npm install -g npm@11.6.0 || true
          npm ci || npm install --no-audit --no-fund

    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_apple_team_id_from_credentials

    - eas/prebuild:
        inputs:
          apple_team_id: ${ steps.resolve_apple_team_id_from_credentials.apple_team_id }

    - run:
        name: Install pods
        working_directory: ./ios
        command: pod install

    - eas/configure_eas_update:
        inputs:
          throw_if_not_configured: false

    - eas/configure_ios_credentials

    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }

    - eas/run_fastlane

    - eas/find_and_upload_build_artifacts
